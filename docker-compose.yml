services:
  backend:
    build: ./backend
    ports:
      - "8014:8014"
    environment:
      - APP_ENV=local
  frontend:
    build: ./frontend
    ports:
      - "5194:5194"
    environment:
      # 前端容器里的 127.0.0.1 是它自己，必须走 Compose 服务名访问后端。
      VITE_PROXY_TARGET: http://backend:8014
    depends_on:
      - backend
